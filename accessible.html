<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #7b2cbf,
          #3c096c,
          #000000,
          #5a189a,
          #240046
        );

      background-size: 400% 400%;
      animation: backgroundMove 15s ease infinite;

      color: #f5f5f5;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow-x: hidden;
      position: relative;
    }

    /* =========================
       ANIMATED BACKGROUND
    ========================== */

    body::before,
    body::after {
      content: "";
      position: fixed;

      width: 280px;
      height: 280px;

      border-radius: 50%;

      background: rgba(199, 125, 255, 0.18);

      filter: blur(70px);

      pointer-events: none;
      z-index: -1;
    }

    body::before {
      top: 5%;
      left: 5%;
      animation: floatingOrb 8s ease-in-out infinite;
    }

    body::after {
      right: 5%;
      bottom: 5%;
      animation: floatingOrbReverse 10s ease-in-out infinite;
    }

    /* =========================
       MAIN CONTAINER
    ========================== */

    .container {
      width: 100%;
      max-width: 700px;

      background: rgba(0, 0, 0, 0.4);

      padding: 35px 40px;

      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(199, 125, 255, 0.12);

      animation:
        containerAppear 1s ease forwards,
        containerGlow 5s ease-in-out infinite;

      position: relative;
      overflow: hidden;
    }

    /* Moving shine across the glass container */

    .container::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 60%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );

      transform: skewX(-20deg);

      animation: glassShine 6s ease-in-out infinite;

      pointer-events: none;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      text-align: center;
      animation: fadeDown 0.9s ease forwards;
    }

    h1 {
      font-size: 2.4rem;
      margin: 0 0 10px;

      color: #ffffff;

      border-bottom: 3px solid #c77dff;
      padding-bottom: 10px;

      text-shadow:
        0 0 10px rgba(199, 125, 255, 0.7),
        0 0 25px rgba(199, 125, 255, 0.35);

      animation: titleGlow 3s ease-in-out infinite;
    }

    h2 {
      color: #c77dff;
      font-size: 1.4rem;
    }

    header p {
      color: #eeeeee;
      animation: fadeUp 1s ease 0.3s both;
    }

    strong {
      color: #e0aaff;
    }

    /* =========================
       FORM
    ========================== */

    form {
      margin-top: 25px;
    }

    /* =========================
       FORM LABELS
    ========================== */

    label {
      color: #eeeeee;
      font-weight: bold;

      transition: 0.3s ease;
    }

    label:hover {
      color: #e0aaff;
      text-shadow: 0 0 8px rgba(199, 125, 255, 0.6);
    }

    /* =========================
       TEXT INPUTS
    ========================== */

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    textarea {
      width: 100%;

      padding: 12px;

      margin-top: 5px;

      color: #ffffff;

      background-color: rgba(255, 255, 255, 0.08);

      border: 1px solid #9d4edd;
      border-radius: 8px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;

      outline: none;

      transition:
        0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;

      animation: inputAppear 0.7s ease both;
    }

    /* Input hover */

    input[type="text"]:hover,
    input[type="email"]:hover,
    input[type="number"]:hover,
    input[type="date"]:hover,
    textarea:hover {
      background-color: rgba(255, 255, 255, 0.12);

      border-color: #c77dff;

      transform: translateY(-2px);
    }

    /* Input focus */

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border-color: #e0aaff;

      background-color: rgba(255, 255, 255, 0.13);

      box-shadow:
        0 0 8px rgba(199, 125, 255, 0.5),
        0 0 20px rgba(199, 125, 255, 0.2);

      transform: translateY(-2px) scale(1.01);
    }

    /* =========================
       PLACEHOLDER
    ========================== */

    textarea::placeholder,
    input::placeholder {
      color: #bbbbbb;
      transition: 0.3s ease;
    }

    input:focus::placeholder,
    textarea:focus::placeholder {
      color: #d8b4fe;
    }

    /* =========================
       TEXTAREA
    ========================== */

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* =========================
       FIELDSETS
    ========================== */

    fieldset {
      margin: 20px 0;
      padding: 20px;

      border: 1px solid #9d4edd;
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25);

      transition:
        0.35s ease,
        box-shadow 0.35s ease;

      animation: fieldsetAppear 0.8s ease both;
    }

    fieldset:hover {
      transform: translateY(-3px);

      border-color: #c77dff;

      background: rgba(255, 255, 255, 0.08);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(199, 125, 255, 0.18);
    }

    legend {
      padding: 0 10px;

      color: #e0aaff;
      font-weight: bold;

      text-shadow:
        0 0 8px rgba(199, 125, 255, 0.5);

      transition: 0.3s ease;
    }

    fieldset:hover legend {
      color: #ffffff;
    }

    fieldset label {
      font-weight: normal;
      margin-left: 5px;

      transition: 0.25s ease;
    }

    fieldset label:hover {
      color: #e0aaff;
      transform: translateX(3px);
    }

    /* =========================
       RADIO BUTTONS / CHECKBOXES
    ========================== */

    input[type="radio"],
    input[type="checkbox"] {
      accent-color: #9d4edd;

      margin: 8px 5px 8px 0;

      cursor: pointer;

      transition: 0.25s ease;
    }

    input[type="radio"]:hover,
    input[type="checkbox"]:hover {
      transform: scale(1.2);
      filter: drop-shadow(0 0 5px #c77dff);
    }

    input[type="radio"]:checked,
    input[type="checkbox"]:checked {
      filter: drop-shadow(0 0 6px #c77dff);
    }

    /* =========================
       SUBMIT BUTTON
    ========================== */

    button {
      display: block;

      margin: 25px auto 10px;

      padding: 12px 35px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-weight: bold;

      color: white;

      background:
        linear-gradient(
          135deg,
          #9d4edd,
          #5a189a
        );

      border: none;
      border-radius: 10px;

      cursor: pointer;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.4);

      transition:
        0.3s ease,
        box-shadow 0.3s ease;

      animation:
        buttonAppear 1s ease 1s both,
        buttonPulse 3s ease-in-out 2s infinite;
    }

    button:hover {
      background:
        linear-gradient(
          135deg,
          #c77dff,
          #7b2cbf
        );

      transform:
        translateY(-4px)
        scale(1.04);

      box-shadow:
        0 7px 20px rgba(199, 125, 255, 0.4),
        0 0 25px rgba(199, 125, 255, 0.3);
    }

    button:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* =========================
       HOME BUTTON
    ========================== */

    .buttons {
      text-align: center;
      margin-top: 20px;

      animation: fadeUp 1s ease 1.3s both;
    }

    .btn {
      display: inline-block;

      padding: 10px 25px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #9d4edd,
          #5a189a
        );

      text-decoration: none;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-weight: bold;

      border-radius: 10px;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.4);

      transition:
        0.3s ease;

      animation: homePulse 3s ease-in-out infinite;
    }

    .btn:hover {
      background:
        linear-gradient(
          135deg,
          #c77dff,
          #7b2cbf
        );

      transform:
        translateY(-4px)
        scale(1.05);

      box-shadow:
        0 7px 20px rgba(199, 125, 255, 0.4),
        0 0 25px rgba(199, 125, 255, 0.3);
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      text-align: center;

      margin-top: 30px;

      animation: fadeUp 1s ease 1.1s both;
    }

    hr {
      border: none;

      border-top: 1px solid #9d4edd;

      box-shadow:
        0 0 8px rgba(199, 125, 255, 0.4);
    }

    footer p {
      color: #bbbbbb;
      font-size: 0.9rem;

      transition: 0.3s ease;
    }

    footer p:hover {
      color: #e0aaff;
      text-shadow:
        0 0 8px rgba(199, 125, 255, 0.5);
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes backgroundMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes floatingOrb {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(80px, 50px) scale(1.2);
      }
    }

    @keyframes floatingOrbReverse {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-70px, -60px) scale(1.25);
      }
    }

    @keyframes containerAppear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes containerGlow {
      0%,
      100% {
        box-shadow:
          0 10px 35px rgba(0, 0, 0, 0.5),
          0 0 30px rgba(199, 125, 255, 0.12);
      }

      50% {
        box-shadow:
          0 15px 40px rgba(0, 0, 0, 0.55),
          0 0 45px rgba(199, 125, 255, 0.25);
      }
    }

    @keyframes glassShine {
      0% {
        left: -120%;
      }

      35%,
      100% {
        left: 140%;
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes inputAppear {
      from {
        opacity: 0;
        transform: translateX(-15px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fieldsetAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleGlow {
      0%,
      100% {
        text-shadow:
          0 0 10px rgba(199, 125, 255, 0.7),
          0 0 25px rgba(199, 125, 255, 0.35);
      }

      50% {
        text-shadow:
          0 0 15px rgba(199, 125, 255, 0.9),
          0 0 35px rgba(199, 125, 255, 0.55);
      }
    }

    @keyframes buttonAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes buttonPulse {
      0%,
      100% {
        box-shadow:
          0 5px 15px rgba(0, 0, 0, 0.4);
      }

      50% {
        box-shadow:
          0 7px 25px rgba(199, 125, 255, 0.45),
          0 0 20px rgba(199, 125, 255, 0.2);
      }
    }

    @keyframes homePulse {
      0%,
      100% {
        box-shadow:
          0 5px 15px rgba(0, 0, 0, 0.4);
      }

      50% {
        box-shadow:
          0 7px 25px rgba(199, 125, 255, 0.45),
          0 0 20px rgba(199, 125, 255, 0.2);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      body {
        padding: 20px 10px;
      }

      .container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="date"],
      textarea {
        font-size: 0.95rem;
      }

      button,
      .btn {
        width: 100%;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🎓 Web Development Workshop — Registration Form</h1>

      <p>
        Please fill in all required fields to reserve your spot!
      </p>
    </header>

    <main>
      <section>

        <form action="#" method="post">

          <!-- FULL NAME -->
          <label for="name">Full Name:</label>

          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
          >

          <br><br>

          <!-- EMAIL -->
          <label for="email">Email Address:</label>

          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email address"
          >

          <br><br>

          <!-- AGE -->
          <label for="age">Age:</label>

          <input
            type="number"
            id="age"
            name="age"
            min="10"
            max="120"
            placeholder="Enter your age"
          >

          <br><br>

          <!-- DATE -->
          <label for="date">Preferred Workshop Date:</label>

          <input
            type="date"
            id="date"
            name="date"
            required
          >

          <!-- TRACK SELECTION -->
          <fieldset>

            <legend>Track Selection:</legend>

            <input
              type="radio"
              id="beginner"
              name="track"
              value="beginner"
              required
            >

            <label for="beginner">
              Beginner — HTML & CSS Basics
            </label>

            <br>

            <input
              type="radio"
              id="intermediate"
              name="track"
              value="intermediate"
            >

            <label for="intermediate">
              Intermediate — Responsive Design
            </label>

            <br>

            <input
              type="radio"
              id="advanced"
              name="track"
              value="advanced"
            >

            <label for="advanced">
              Advanced — JavaScript Introduction
            </label>

          </fieldset>

          <!-- LEARNING MODE -->
          <fieldset>

            <legend>Preferred Learning Mode:</legend>

            <input
              type="checkbox"
              id="online"
              name="mode"
              value="online"
            >

            <label for="online">
              Online / Virtual
            </label>

            <br>

            <input
              type="checkbox"
              id="onsite"
              name="mode"
              value="onsite"
            >

            <label for="onsite">
              On-Site / Face-to-Face
            </label>

            <br>

            <input
              type="checkbox"
              id="selfpaced"
              name="mode"
              value="selfpaced"
            >

            <label for="selfpaced">
              Self-Paced (Recorded Sessions)
            </label>

          </fieldset>

          <!-- EXPECTATIONS -->
          <label for="message">
            What do you hope to learn or achieve?
          </label>

          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Share your expectations or goals for this workshop..."
          ></textarea>

          <!-- SUBMIT -->
          <button type="submit">
            ✅ Submit Registration
          </button>

        </form>

      </section>
    </main>

    <!-- FOOTER -->
    <footer>

      <hr>

      <p>
        &copy; 2026 Web Development Workshop. All rights reserved.
      </p>

    </footer>

    <!-- HOME BUTTON -->
    <div class="buttons">

      <a href="home.html" class="btn">
        🏠 Home
      </a>

    </div>

  </div>

</body>
</html>
